name: Deploy be1 to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install dependencies
        run: |
          cd api
          composer install --no-dev --optimize-autoloader --no-interaction

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "api/lib,api/src,api/vendor,api/composer.*,api/Caddyfile,api/public,api/swetest"
          target: "/opt/be1"
          strip_components: 0
          rm: false

      - name: Restart be1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart be1
            sleep 3
            echo "Health: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/ping)"
